<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Hub - Available Books</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background Decorations -->

    <div class="decorations">

        <span class="icon icon1">📖</span>
        <span class="icon icon2">✎</span>
        <span class="icon icon3">▱</span>
        <span class="icon icon4">📚</span>
        <span class="icon icon5">✦</span>

        <span class="icon icon6">✎</span>
        <span class="icon icon7">📖</span>
        <span class="icon icon8">📚</span>
        <span class="icon icon9">✦</span>
        <span class="icon icon10">▱</span>

        <span class="icon icon11">📖</span>
        <span class="icon icon12">✎</span>
        <span class="icon icon13">📚</span>
        <span class="icon icon14">✦</span>
        <span class="icon icon15">📖</span>

    </div>


    <!-- Available Books Page -->

    <div class="books-page">

        <h1>Available Books</h1>

        <p class="books-subtitle">
            Search for a book in our library
        </p>


        <!-- Search Box -->

        <div class="search-container">

            <input
                type="text"
                id="bookSearch"
                placeholder="Search for a book..."
            >

            <button onclick="searchBook()">
                SEARCH
            </button>

        </div>


        <!-- Search Result -->

        <div id="bookResult"></div>

    </div>


    <script src="script.js"></script>

</body>

</html>
